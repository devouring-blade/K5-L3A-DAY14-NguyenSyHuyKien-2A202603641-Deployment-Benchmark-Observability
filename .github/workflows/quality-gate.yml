name: Agent quality gate
on: [push, pull_request]
jobs:
  evaluate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 06-lab-complete/benchmark-observability/develop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Start v2 (disable injected faults for deterministic quality evaluation)
        run: |
          AGENT_VERSION=v2 MOCK_ERROR_RATE=0 MOCK_SLOW_RATE=0 python app.py > /tmp/agent.log 2>&1 &
          python - <<'PY'
          import time, urllib.request
          for attempt in range(100):
              try:
                  if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=1).status == 200:
                      break
              except OSError:
                  time.sleep(0.2)
          else:
              raise SystemExit('Agent failed to start')
          PY
      - name: Require 100 percent accuracy and no regressions
        run: python eval/run_eval.py --min-accuracy 1.0 --baseline ../../../reports/eval_v2_fixed.json --out reports/ci-eval.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-evaluation
          path: 06-lab-complete/benchmark-observability/develop/reports/ci-eval.json
